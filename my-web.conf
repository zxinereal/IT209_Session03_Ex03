server {
    listen 80;
    server_name _;

    root /var/www/my-web/html;
    index index.html;

    # /admin và toàn bộ nội dung con yêu cầu HTTP Basic Authentication.
    location ^~ /admin {
        auth_basic "Restricted Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
